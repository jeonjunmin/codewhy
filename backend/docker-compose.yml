# ══════════════════════════════════════════════════════════════════════════════
#  CodeWhy 백엔드 — EC2 배포용 Compose
#  사용법:
#    1) 최초/스키마 변경 시:  docker compose run --rm migrate
#    2) 앱 기동:              docker compose up -d --build
#  AWS 자격증명은 .env 에 넣지 말고 EC2 IAM Instance Profile 로 주입한다.
# ══════════════════════════════════════════════════════════════════════════════
# network_mode: host — EC2 호스트에 직접 설치한 PostgreSQL 을 쓸 때.
#   컨테이너가 호스트 네트워크를 공유해 DATABASE_URL 의 localhost:5432 가 호스트 postgres 를 가리킨다.
#   호스트 모드에선 ports 매핑이 불필요/충돌이므로 빼고, uvicorn 이 호스트 8000 에 직접 바인딩한다.
#   ※ RDS 를 쓰는 환경이라면 network_mode 를 빼고(기본 bridge) DATABASE_URL 을 RDS 엔드포인트로 두세요.
services:
  api:
    build: .
    image: codewhy-backend:latest
    env_file: .env
    network_mode: host       # 호스트 postgres(localhost:5432) 접근. RDS 면 이 줄 제거 + ports 복구
    # ports:                 # host 모드에선 무효/충돌 — uvicorn 이 호스트 8000 에 직접 바인딩
    #   - "8000:8000"        # Nginx 뒤에 둘 경우 "127.0.0.1:8000:8000" 으로 좁히세요
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/docs'); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Alembic 마이그레이션 — 일회성 실행 (docker compose run --rm migrate)
  migrate:
    image: codewhy-backend:latest
    build: .
    env_file: .env
    network_mode: host       # api 와 동일 — 호스트 postgres 로 마이그레이션
    command: ["alembic", "upgrade", "head"]
    restart: "no"

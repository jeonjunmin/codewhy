# ══════════════════════════════════════════════════════════════════════════════
#  CodeWhy 백엔드 — Nginx 리버스 프록시
#  /etc/nginx/conf.d/codewhy.conf 로 복사 후 `sudo nginx -t && sudo systemctl reload nginx`
#  HTTPS 는 certbot 으로 발급:  sudo certbot --nginx -d api.example.com
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name api.example.com;          # ← 실제 도메인으로 교체

    client_max_body_size 50m;             # 문서 업로드(multipart) 여유

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # Bedrock/LLM 호출이 길 수 있어 여유
    }
}
